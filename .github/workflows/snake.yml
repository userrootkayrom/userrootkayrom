name: Generate Snake Animation

on:
  schedule:
    # Executa automaticamente a cada 12 horas
    - cron: "0 */12 * * *" 
  
  # Permite rodar o script manualmente
  workflow_dispatch:
  
  # Executa toda vez que houver um push na branch main
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake Files
        uses: Platane/snk@v3
        with:
          # Puxa automaticamente o seu usuário (userrootkayrom)
          github_user_name: ${{ github.repository_owner }}
          
          # Gera os arquivos na pasta dist
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
